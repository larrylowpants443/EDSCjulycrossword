<!DOCTYPE html>
<html>

<head>

<title>EDSC Mini Crossword</title>

<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    font-family:Arial, sans-serif;

    text-align:center;

    background:#f5f5f5;

    overflow-x:hidden;

}



body::before{

    content:"";

    position:fixed;

    inset:-200px;


    background:
    repeating-linear-gradient(
        45deg,
        transparent 0px,
        transparent 40px,
        rgba(11,45,92,0.08) 42px,
        transparent 44px
    );


    animation:moveLines 8s linear infinite;

    z-index:-1;

}



@keyframes moveLines{

    from{
        transform:translate(0,0);
    }


    to{
        transform:translate(100px,-100px);
    }

}

#completePopup{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.35);

    backdrop-filter:blur(4px);

    justify-content:center;

    align-items:center;

    z-index:200;

}


#confirmRevealPopup{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.35);

    backdrop-filter:blur(4px);

    justify-content:center;

    align-items:center;

    z-index:250;

}

#failPopup{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.35);

    backdrop-filter:blur(4px);

    justify-content:center;

    align-items:center;

    z-index:200;

}

.popupCard{


    background:white;


    padding:35px;


    border-radius:18px;


    width:350px;


    box-shadow:
    0 10px 40px rgba(0,0,0,0.3);


    border-top:8px solid;


    border-image:
    linear-gradient(
        90deg,
        #ffd700 50%,
        #0b2d5c 50%
    ) 1;


}

#pauseOverlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(255,255,255,0.35);

    backdrop-filter:blur(6px);

    z-index:150;

    justify-content:center;

    align-items:center;

}


.pauseBox{

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.2);

}


/* START SCREEN */


#startScreen{

    position:fixed;

    inset:0;

    background:#f5f5f5;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:100;

}

.startCard{


    background:white;


    padding:40px;


    border-radius:18px;


    box-shadow:
    0 10px 30px rgba(0,0,0,0.15);


    border-top:8px solid;


    border-image:
    linear-gradient(
        90deg,
        #ffd700 50%,
        #0b2d5c 50%
    ) 1;


}

#startScreen h1{

    font-size:45px;

}




/* MAIN GAME */


#game{

    display:none;

}



h1{

    margin-top:30px;

}




#timer{

    font-size:22px;

    margin-top:10px;

}





.container{

    display:flex;

    justify-content:center;

    align-items:flex-start;

    gap:35px;

    margin-top:30px;

}





.box{

    width:230px;

    background:white;

    padding:20px;

    border-radius:12px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.15);

    text-align:left;

}





.clue{

    padding:8px;

    border-radius:6px;

    margin-bottom:5px;

}





.active{

    background:#ffd700;

}





.grid{

    display:grid;

    grid-template-columns:repeat(5,70px);

    gap:3px;

    background:white;

    padding:5px;

    border-radius:8px;

}





.cell{

    width:70px;

    height:70px;

    border:2px solid black;

    font-size:35px;

    text-align:center;

    text-transform:uppercase;

    outline:none;

}




.cell:focus{

    outline:3px solid #4da6ff;

}





.block{

    background:black;

    border:none;

}





.selected{

    background:#b9ddff;

}





.revealed{

    background:#4da6ff!important;

    color:white;

}





button{

    margin:10px;

    padding:12px 25px;

    font-size:16px;

    border:none;

    border-radius:8px;

    cursor:pointer;

}


#pauseButton{

    position:fixed;

    top:20px;

    left:20px;

    width:55px;

    height:55px;

    font-size:25px;

    z-index:300;

    display:flex;
    justify-content:center;
    align-items:center;

      transition:transform 0.2s ease;

}


.pauseHint{

    font-size:35px;

}

}



button:hover{

    transform:scale(1.05);

}





#stats{

    font-size:22px;

    margin-top:20px;

}





.flash{

    animation:celebrate 2.5s;

}





@keyframes celebrate{


0%{

background:#f5f5f5;

}


25%{

background:#b9ddff;

}


50%{

background:#f5f5f5;

}


75%{

background:#ffe680;

}


100%{

background:#f5f5f5;

}


}





.confetti{

    position:fixed;

    width:12px;

    height:18px;

    top:160px;

    left:50%;

    animation:explode 3s forwards;

}

.sadEmoji{

    position:fixed;

    top:-50px;

    font-size:35px;

    z-index:300;

    animation:fall 4s linear forwards;

}


@keyframes fall{

    from{

        transform:translateY(0) rotate(0deg);

    }


    to{

        transform:translateY(120vh) rotate(360deg);

    }

}



@keyframes explode{

    to{

        transform:
        translate(var(--x),var(--y))
        rotate(720deg);

    }

}

/* ============================= */
/* MOBILE RESPONSIVE DESIGN */
/* ============================= */
#mobileClue{
    display:none;
}

@media (max-width: 700px){

    #game{
        width:100%;
        padding:0 8px;
    }

    #game h1{
        font-size:22px;
        margin-top:5px;
        margin-bottom:4px;
    }

    #timer{
        font-size:17px;
        margin-top:5px;
        margin-bottom:12px;
    }

    .container{
        flex-direction:column;
        align-items:center;
        gap:8px;
        margin-top:10px;
        width:100%;
    }


    /* ===================== */
    /* SMALL MOBILE GRID */
    /* ===================== */

    .grid{
        order:1;
        grid-template-columns:repeat(5,44px);
        gap:2px;
        padding:3px;
    }

    .cell{
        width:44px;
        height:44px;
        font-size:20px;
    }


    /* ===================== */
    /* MOBILE CLUE */
    /* ===================== */

    .container .box{
        display:none;
    }

   #mobileClue{
    display:block;
    width:236px;
    box-sizing:border-box;
    background:#b9ddff;
    padding:9px 10px;
    margin:8px auto 0 auto;
    border-radius:0;
    font-size:14px;
    text-align:center;
    min-height:40px;
}

    #mobileClueText{
        display:block;
    }


    /* ===================== */
    /* BUTTONS */
    /* ===================== */

    #pauseButton{
        width:45px;
        height:45px;
        top:10px;
        left:10px;
        font-size:20px;
    }

    button{
        font-size:14px;
        padding:9px 16px;
        margin:5px;
    }


    /* ===================== */
    /* START SCREEN */
    /* ===================== */

    .startCard{
        width:calc(100% - 30px);
        max-width:400px;
        padding:25px 15px;
    }

    #startScreen h1{
        font-size:32px;
    }


    /* ===================== */
    /* POPUPS */
    /* ===================== */

    .popupCard{
        width:calc(100% - 30px);
        max-width:350px;
        padding:25px 18px;
    }

}



</style>

</head>


<body>


<!-- START PAGE -->


<div id="startScreen">

<div class="startCard">

<h1>EDSC Mini Crossword</h1>

<h2 id="puzzleDate"></h2>

<button id="startButton">
Start Puzzle
</button>

</div>

</div>




<!-- GAME -->


<div id="game">

<button id="pauseButton">
⏸
</button>

<h1>EDSC Mini Crossword</h1>


<div id="timer">
Time: 00:00
</div>



<div class="container">


<div class="box">

<h2>Across</h2>

<div id="across"></div>

</div>




<div id="grid" class="grid"></div>




<div class="box">

<h2>Down</h2>

<div id="down"></div>

</div>


</div>

<div id="mobileClue">
    <span id="mobileClueText"></span>
</div>





<button id="revealWordButton">
Reveal Word
</button>


<button id="revealPuzzleButton">
Reveal Puzzle
</button>

<button id="statsButton" style="display:none;">
See Stats
</button>


<div id="stats"></div>

<div id="pauseOverlay">

<div class="pauseBox">

<h1>Paused...</h1>



</div>

</div>

<div id="failPopup">

<div class="popupCard">

<h1>🥲 Puzzle Revealed</h1>

<p>Better luck next time!</p>

<button id="failAdmireButton">
Admire Puzzle
</button>

</div>

</div>

<div id="confirmRevealPopup">

<div class="popupCard">

<h1>⚠️ Are you sure?</h1>

<p>
Revealing the puzzle will end your attempt.
</p>

<button id="cancelRevealButton">
Cancel
</button>

<button id="confirmRevealButton">
Reveal Puzzle
</button>

</div>

</div>

<div id="completePopup">


<div class="popupCard">


<h1>🎉 Completed!</h1>


<p id="finalTime"></p>


<p id="finalHints"></p>


<button id="admireButton">
Admire Puzzle
</button>


</div>


</div>


</div>





<script>


// =====================================
// EDIT WEEKLY PUZZLE HERE
// =====================================


const puzzle = {


date:"September 2026",



grid:[

["#","E","D","S","C"],

["S","L","O","T","H"],

["I","G","L","O","O"],

["R","A","M","P","S"],

["E","R","A","S","E"]

],



across:[

"Ms. Boyle is the principal of...",

"Flash from Zootopia'...",

"House made entirely of ice",

"Used for wheelchair accesibility",

"Remove a mistake"

],



down:[

"The male parent of an animal, also a way to address male royalty",

"Main road from Box Hill to Doncaster",

"Name of a stuffed-grape leaf dish",

"A bus makes many of these",

"Made a decision"

]


};

// =====================================
// VARIABLES
// =====================================


let cells=[];

let direction="across";

let selectedCell=null;

let started=false;

let paused=false;

let finished=false;

let admireMode=false;

let seconds=0;

let timer=null;

let revealedWords=[];

let hintsUsed=0;

let puzzleRevealed=false;



const grid=document.getElementById("grid");





// =====================================
// DISPLAY DATE
// =====================================


document.getElementById("puzzleDate")
.innerHTML=puzzle.date;







// =====================================
// CREATE GRID
// =====================================


for(let r=0;r<5;r++){


    for(let c=0;c<5;c++){


        let value=puzzle.grid[r][c];



        if(value==="#"){


            let block=document.createElement("div");

            block.className="cell block";

            grid.appendChild(block);

            cells.push(null);


        }



        else{


            let cell=document.createElement("input");


            cell.className="cell";

            cell.maxLength=1;


            cell.dataset.row=r;

            cell.dataset.col=c;




            cell.addEventListener("click",()=>{


                if(!started || paused) return;


                selectCell(cell);


            });





            cell.addEventListener("input",()=>{


                if(!started || paused) return;


                cell.value=
                cell.value.toUpperCase();



                moveForward(cell);


                checkWin();


            });







            cell.addEventListener("keydown",(e)=>{

                if(e.key==="Enter"){

        e.preventDefault();

        let r = Number(cell.dataset.row);
        let c = Number(cell.dataset.col);

        let next = null;

        if(direction==="across"){

            for(let y=r+1;y<5;y++){

                for(let x=0;x<5;x++){

                    if(getCell(y,x)){
                        next=getCell(y,x);
                        break;
                    }

                }

                if(next) break;
            }

        }else{

            for(let x=c+1;x<5;x++){

                for(let y=0;y<5;y++){

                    if(getCell(y,x)){
                        next=getCell(y,x);
                        break;
                    }

                }

                if(next) break;
            }

        }

       if(next){

    next.focus();
    next.setSelectionRange(1,1);

    selectedCell=next;
    highlight(next);

}else{

    if(direction==="across"){

     direction="down";

// Find the first Down clue
for(let c=0;c<5 && !next;c++){

    for(let r=0;r<5;r++){

        let current = getCell(r,c);

        if(current && (r===0 || !getCell(r-1,c))){

            next = current;
            break;

        }

    }

}   // first down clue (E)

    }else{

        direction="across";

        next=getCell(0,1);   // first across clue (EDSC)

    }

    if(next){

        next.focus();
        next.setSelectionRange(1,1);
        selectedCell=next;
        highlight(next);

    }

}

return;
    }
               
if(e.key==="Backspace" || e.key==="Delete"){

    e.preventDefault();

    if(cell.value!==""){

        cell.value="";
        checkWin();

    }else{

        moveBackward(cell);

    }

    return;
}


            });





            grid.appendChild(cell);

            cells.push(cell);


        }


    }


}








function getCell(r,c){


    if(r<0 || r>=5 || c<0 || c>=5){

        return null;

    }


    return cells[r*5+c];


}







// =====================================
// LOAD CLUES
// =====================================


for(let i=0;i<5;i++){


    document.getElementById("across")
    .innerHTML +=

    `
    <div class="clue" id="across${i}">
    ${i+1}. ${puzzle.across[i]}
    </div>
    `;




    document.getElementById("down")
    .innerHTML +=

    `
    <div class="clue" id="down${i}">
    ${i+1}. ${puzzle.down[i]}
    </div>
    `;


}








// =====================================
// SELECT + HIGHLIGHT
// =====================================



function selectCell(cell){



    if(selectedCell===cell){


        direction =
        direction==="across"
        ? "down"
        : "across";


    }



    selectedCell=cell;


    highlight(cell);



}







function highlight(cell){

    clearHighlight();

    let r=Number(cell.dataset.row);
    let c=Number(cell.dataset.col);

    let mobileClueText =
        document.getElementById("mobileClueText");


    if(direction==="across"){

        let start=c;

        while(start>0 && getCell(r,start-1)){
            start--;
        }

        while(start<5 && getCell(r,start)){

            getCell(r,start)
            .classList.add("selected");

            start++;

        }

        let clue =
            document.getElementById("across"+r);

        clue.classList.add("active");

        mobileClueText.innerHTML =
            clue.innerHTML;

    }


    else{

        let start=r;

        while(start>0 && getCell(start-1,c)){
            start--;
        }

        while(start<5 && getCell(start,c)){

            getCell(start,c)
            .classList.add("selected");

            start++;

        }

        let clue =
            document.getElementById("down"+c);

        clue.classList.add("active");

        mobileClueText.innerHTML =
            clue.innerHTML;

    }

}









function clearHighlight(){


    cells.forEach(cell=>{


        if(cell){

            cell.classList.remove("selected");

        }


    });



    document.querySelectorAll(".clue")
    .forEach(clue=>{


        clue.classList.remove("active");


    });


}








// =====================================
// MOVEMENT
// =====================================


function moveForward(cell){


    let r=Number(cell.dataset.row);

    let c=Number(cell.dataset.col);


    let next=null;




    if(direction==="across"){


        for(let x=c+1;x<5;x++){


            if(getCell(r,x)){


                next=getCell(r,x);

                break;


            }


        }



        if(!next){


            for(let y=r+1;y<5;y++){


                for(let x=0;x<5;x++){


                    if(getCell(y,x)){


                        next=getCell(y,x);

                        break;


                    }


                }


                if(next) break;


            }


        }



    }



    else{



        for(let y=r+1;y<5;y++){


            if(getCell(y,c)){


                next=getCell(y,c);

                break;


            }


        }




        if(!next){


            for(let x=c+1;x<5;x++){


                for(let y=0;y<5;y++){


                    if(getCell(y,x)){


                        next=getCell(y,x);

                        break;


                    }


                }


                if(next) break;


            }


        }


    }





    if(next){


        next.focus();

        selectedCell=next;

        highlight(next);


    }


}









function moveBackward(cell){


    let r=Number(cell.dataset.row);

    let c=Number(cell.dataset.col);


    let previous=null;





    if(direction==="across"){


        for(let x=c-1;x>=0;x--){


            if(getCell(r,x)){


                previous=getCell(r,x);

                break;


            }


        }




        if(!previous){


            for(let y=r-1;y>=0;y--){


                for(let x=4;x>=0;x--){


                    if(getCell(y,x)){


                        previous=getCell(y,x);

                        break;


                    }


                }


                if(previous) break;


            }


        }



    }




    else{



        for(let y=r-1;y>=0;y--){


            if(getCell(y,c)){


                previous=getCell(y,c);

                break;


            }


        }


    }





    if(previous){


        previous.focus();

        selectedCell=previous;

        highlight(previous);


    }


}

// =====================================
// START BUTTON
// =====================================


document.getElementById("startButton")
.onclick=function(){


    document.getElementById("startScreen")
    .style.display="none";


    document.getElementById("game")
    .style.display="block";


    started=true;


    timer=setInterval(()=>{


        if(!paused && !finished){


            seconds++;


            let mins=Math.floor(seconds/60);

            let secs=seconds%60;


            document.getElementById("timer")
            .innerHTML=

            "Time: "+
            String(mins).padStart(2,"0")
            +
            ":"
            +
            String(secs).padStart(2,"0");


        }


  },1000);

    // Select first cell automatically
    const firstCell = getCell(0,1); // E
    firstCell.focus();
    direction = "across";
    selectedCell = firstCell;
    highlight(firstCell);

};






// =====================================
// PAUSE BUTTON
// =====================================


document.getElementById("pauseButton")
.onclick=function(){


    paused=!paused;


    this.innerHTML =
    paused
    ? "▶"
    : "⏸";



    document.getElementById("pauseOverlay")
    .style.display =
    paused
    ? "flex"
    : "none";



    if(paused){

        document.activeElement.blur();

    }


};





// =====================================
// REVEAL WORD
// =====================================


document.getElementById("revealWordButton")
.onclick=function(){


    if(!selectedCell) return;

    hintsUsed++;


    let r=Number(selectedCell.dataset.row);

    let c=Number(selectedCell.dataset.col);



    if(direction==="across"){



        while(c>0 && getCell(r,c-1)){

            c--;

        }



        while(c<5 && getCell(r,c)){


            let cell=getCell(r,c);


            if(!cell.classList.contains("revealed")){

                revealedWords.push(cell);

            }


            cell.value=puzzle.grid[r][c];

            cell.classList.add("revealed");


            c++;


        }



    }



    else{



        while(r>0 && getCell(r-1,c)){

            r--;

        }



        while(r<5 && getCell(r,c)){


            let cell=getCell(r,c);



            if(!cell.classList.contains("revealed")){

                revealedWords.push(cell);

            }



            cell.value=puzzle.grid[r][c];

            cell.classList.add("revealed");


            r++;


        }



    }

        checkWin();


};









// =====================================
// REVEAL WHOLE PUZZLE
// =====================================


document.getElementById("revealPuzzleButton")
.onclick=function(){


    document.getElementById("confirmRevealPopup")
    .style.display="flex";


};

document.getElementById("cancelRevealButton")
.onclick=function(){

    document.getElementById("confirmRevealPopup")
    .style.display="none";

};

document.getElementById("confirmRevealButton")
.onclick=function(){


    document.getElementById("confirmRevealPopup")
    .style.display="none";


    puzzleRevealed=true;

    paused=true;
    clearInterval(timer);


    createSadEmojis();



    cells.forEach((cell,i)=>{


        if(cell){


            let r=Math.floor(i/5);

            let c=i%5;


            cell.value=puzzle.grid[r][c];

            cell.classList.add("revealed");


        }


    });



    setTimeout(()=>{


        document.getElementById("failPopup")
        .style.display="flex";


    },1000);


};











// =====================================
// CHECK WIN
// =====================================


function checkWin(){


    if(finished) return;



    let correct=true;



    cells.forEach((cell,i)=>{


        if(cell){


            let r=Math.floor(i/5);

            let c=i%5;



            if(cell.value!==puzzle.grid[r][c]){


                correct=false;


            }


        }


    });




    if(correct){


        finished=true;


        clearInterval(timer);



        document.body.classList.add("flash");



        createConfetti();




        setTimeout(()=>{


            let mins=Math.floor(seconds/60);

            let secs=seconds%60;



           document.getElementById("completePopup")
.style.display="flex";


document.getElementById("finalTime")
.innerHTML=
"Time: "+
String(mins).padStart(2,"0")
+
":"
+
String(secs).padStart(2,"0");



document.getElementById("finalHints")
.innerHTML =
"Hints used: "
+
hintsUsed;




        },1000);



    }



}








// =====================================
// CONFETTI
// =====================================


function createConfetti(){



    for(let i=0;i<100;i++){



        let piece=document.createElement("div");


        piece.className="confetti";


        piece.style.background =
        Math.random()>0.5
        ?
        "#ffd700"
        :
        "#0b2d5c";




        let angle=Math.random()*Math.PI*2;


        let distance=200+Math.random()*400;



        piece.style.setProperty(
        "--x",
        Math.cos(angle)*distance+"px"
        );



        piece.style.setProperty(
        "--y",
        Math.sin(angle)*distance+"px"
        );



        document.body.appendChild(piece);



        setTimeout(()=>{


            piece.remove();


        },3000);



    }


}

function createSadEmojis(){

    let emojis=[
        "🥲",
        "😭",
        "😢",
        "💀",
        "😔"
    ];


    for(let i=0;i<40;i++){


        let emoji=document.createElement("div");


        emoji.className="sadEmoji";


        emoji.innerHTML =
        emojis[
        Math.floor(Math.random()*emojis.length)
        ];


        emoji.style.left =
        Math.random()*100+"vw";


        emoji.style.animationDuration =
        (2+Math.random()*3)+"s";


        document.body.appendChild(emoji);


        setTimeout(()=>{

            emoji.remove();

        },5000);


    }

}

document.getElementById("admireButton")
.onclick=function(){


    admireMode=true;


    document.getElementById("completePopup")
    .style.display="none";


    cells.forEach(cell=>{

        if(cell){

            cell.disabled=true;

            cell.classList.add("revealed");

        }

    });

    document.getElementById("revealWordButton")
.style.display="none";


document.getElementById("revealPuzzleButton")
.style.display="none";


document.getElementById("statsButton")
.style.display="inline-block";

};

document.getElementById("failAdmireButton")
.onclick=function(){


    document.getElementById("failPopup")
    .style.display="none";


    cells.forEach(cell=>{

        if(cell){

            cell.disabled=true;

        }

    });

    document.getElementById("revealWordButton")
.style.display="none";


document.getElementById("revealPuzzleButton")
.style.display="none";


document.getElementById("statsButton")
.style.display="inline-block";

};

document.getElementById("statsButton")
.onclick=function(){

    document.getElementById("completePopup")
    .style.display="flex";

};

</script>
